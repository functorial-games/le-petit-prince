name: Pilot geometry and topology
on:
  pull_request:
    paths:
      - "pilot-wireframe/**"
      - ".github/workflows/pilot-geometry.yml"
  push:
    branches: [main, android/native-pilot-face]
    paths:
      - "pilot-wireframe/**"
      - ".github/workflows/pilot-geometry.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  geometry:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out exact head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Check deterministic pilot geometry
        run: python3 pilot-wireframe/check_geometry.py
