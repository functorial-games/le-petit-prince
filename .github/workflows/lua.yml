name: Lua game tests

on:
  push:
    branches:
      - prototype/lua-comet-exit
  pull_request:

jobs:
  lua:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build pinned symbolic Lua
        run: |
          git clone https://github.com/isomorphisms/lua.git "$RUNNER_TEMP/lua"
          git -C "$RUNNER_TEMP/lua" checkout --detach dca7e57c16c524c8616144ed294fe598947a029f
          test "$(git -C "$RUNNER_TEMP/lua" rev-parse HEAD)" = dca7e57c16c524c8616144ed294fe598947a029f
          make -C "$RUNNER_TEMP/lua" -j2
      - name: Run Lua comet state-machine test
        run: |
          "$RUNNER_TEMP/lua/lua" game/test_little_prince.lua
      - name: Run C spherical walker test
        run: sh ./run-tests.sh
