name: Native pilot face MIRO APK
on:
  pull_request:
    paths: ["android/**", "examples/autogenerated/native-pilot-face/**", ".github/workflows/native-pilot-face.yml"]
  push:
    branches: [main, android/native-pilot-face]
    paths: ["android/**", "examples/autogenerated/native-pilot-face/**", ".github/workflows/native-pilot-face.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-pilot-face:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out exact application head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Check out pinned Beauty behavioral reference
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: functorial-games/beauty
          ref: 34d0b6e04023c8ca4e7dd25b2381a2128f12c03a
          path: .beauty-reference
          persist-credentials: false
      - name: Check out canonical Android substrate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: isomorphisms/android-NDK
          ref: d4a4719fb97e8031476bf822697dce8423bc9030
          path: .android-substrate
          persist-credentials: false
      - name: Check out established public development signer
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: isomorphismes/wegert
          ref: dfa3751f0282cdf6a2083c97063b0e8e996d0d92
          path: .test-signing
          sparse-checkout: _/build/app/wegert-debug.keystore
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Native face core and complete reference comparisons
        run: make -f android/Makefile host-test
      - name: Install host GLES rendering inputs
        run: sudo apt-get update
      - run: sudo apt-get install -y --no-install-recommends libegl1-mesa-dev libgles2-mesa-dev
      - name: Render controls at 576 by 1152 on host Mesa
        run: make -f android/Makefile render-test
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install pinned Android SDK and NDK build inputs
        run: sdkmanager "platforms;android-34" "build-tools;36.0.0" "ndk;29.0.14206865"
      - name: Build signed native ARM APK and inspect finished package
        run: make -f android/Makefile apk
      - name: Upload signed test APK with exact-head receipts
        id: artifact
        uses: actions/upload-artifact@v4
        with:
          name: le-petit-prince-pilot-face-miro-a1
          path: |
            build/android/le-petit-prince-pilot-face-miro-a1.apk
            build/android/*.txt
            build/android/*.sha256
            build/android/*.properties
            build/android/*.md
            build/render/
          if-no-files-found: error
          retention-days: 30
